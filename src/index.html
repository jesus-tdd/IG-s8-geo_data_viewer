      #title {

        top: 30px;
        width: 100%;

        color: #fff;
        font-weight: bold;
        background-color: transparent;

        font-family: monospace;

      #legend {
        position: absolute;
        top: 50%;
        left: 70px;

        font-family: monospace;

      }

      #legend-title {
        position: absolute;
        top: -42px;
        right: 0;
        white-space: nowrap;
        font-weight: bold;
      }

      #legend-bar {
        width: 16px;
        height: 100%;
        border: 1px solid #fff;
      }

      #legend-ticks {
        position: relative;
        width: 40px;
      }

      #legend-ticks span {
        position: absolute;
        transform: translateY(50%);
      }
